# Tiny Tapeout project information
project:
  title:        "Mocarabe: a programmable time-multiplexed CGRA"
  author:       "Fred Tombs"
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "2x2 torus of 8-bit PEs, configured serially (demo: int_level1_linear)"      # One line description of what your project does
  language:     "SystemVerilog"
  clock_hz:     50000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "3x2"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_gigeresk_mocarabe"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "tt_um_gigeresk_mocarabe.v"
    - "mocarabe.sv"
    - "torus_switch.sv"
    - "pe_2_input.sv"
    - "pe_mux_n_input.sv"
    - "pe_srl.v"
    - "SRL16E.v"
    - "SRLC32E.v"
    - "SRL64.v"
    - "cfg_loader.sv"
    - "cfg_row.sv"
    - "pe_cfg.sv"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "cfg_data[0] / in[0]"
  ui[1]: "cfg_data[1] / in[1]"
  ui[2]: "cfg_data[2] / in[2]"
  ui[3]: "cfg_data[3] / in[3]"
  ui[4]: "cfg_data[4] / in[4]"
  ui[5]: "cfg_data[5] / in[5]"
  ui[6]: "cfg_data[6] / in[6]"
  ui[7]: "cfg_data[7] / in[7]"

  # Outputs
  uo[0]: "out[0]"
  uo[1]: "out[1]"
  uo[2]: "out[2]"
  uo[3]: "out[3]"
  uo[4]: "out[4]"
  uo[5]: "out[5]"
  uo[6]: "out[6]"
  uo[7]: "out[7]"

  # Bidirectional pins
  uio[0]: "cfg_en"
  uio[1]: "out_valid"
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
